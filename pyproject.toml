[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sandzenity-encdeform"
version = "0.1.0"
description = "按段落统计越狱的编码变形相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sandzenity" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sandzenity.github.io"
Repository = "https://github.com/sandzenity/encdeform"
Issues = "https://github.com/sandzenity/encdeform/issues"

[project.scripts]
encdeform = "encdeform:main"

[tool.setuptools]
py-modules = ["encdeform"]
